owner: senomorf
repo: status

# Monitoring for the m0r.phd fleet, deliberately running on GitHub Actions rather
# than on the machines it watches. A monitor inside the monitored infrastructure
# cannot report that infrastructure being down, which is the one case it exists for.
#
# EVERY CHECK MUST SET A REAL User-Agent. GitHub's runners are Azure datacentre
# addresses, and Cloudflare's bot scoring answers a default-UA request from those
# ranges with 403. Measured on the fleet 2026-08-04: an identical request got 200
# from a residential address and 403 from a VPS. Without this the page would sit
# permanently red for a reason that has nothing to do with the services.
sites:
  - name: LibreChat
    url: https://chat.m0r.phd/health
    headers:
      - "User-Agent: upptime-m0r-phd/1.0 (+https://github.com/senomorf/status)"

  - name: Authelia
    # /api/health needs no authentication and does not touch storage.
    url: https://auth.m0r.phd/api/health
    headers:
      - "User-Agent: upptime-m0r-phd/1.0 (+https://github.com/senomorf/status)"

  - name: Komodo
    url: https://komodo.m0r.phd/
    headers:
      - "User-Agent: upptime-m0r-phd/1.0 (+https://github.com/senomorf/status)"

  - name: AIOStreams
    url: https://aiostreams.m0r.phd/
    headers:
      - "User-Agent: upptime-m0r-phd/1.0 (+https://github.com/senomorf/status)"

status-website:
  # Served from senomorf.github.io/status, NOT from a name on the m0r.phd zone.
  # That is the point: a Cloudflare incident would otherwise take down both the
  # services and the page explaining why they are down. If a custom domain is ever
  # wanted, CNAME it to GitHub Pages **grey-clouded**, never proxied.
  baseUrl: /status
  name: m0r.phd status
  introTitle: "Status of the **m0r.phd** services"
  introMessage: >
    Checked every five minutes from GitHub Actions, outside the infrastructure being
    watched. Incidents open as issues in
    [this repository](https://github.com/senomorf/status).
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# GitHub Actions `schedule` is best-effort: a 5-minute cron routinely drifts to 30+
# minutes under load, and runs can be skipped silently. That is survivable for a
# status page and NOT survivable for alerting, which is why cloudlab-uptime stays
# on dunkirk with OnFailure to ntfy. The two are complementary, not redundant.
